name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
# Runs on the repo's current default branch (claude/daily-note-web-app-mw71fn)
# as well as main/master, so it also works after you rename/merge to main.

on:
  push:
    branches: [main, master, claude/daily-note-web-app-mw71fn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Base path must match the Pages URL (/<repo>/). Derived from the repo name.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
